[project]
name = "sdl-decision-record"
version = "0.1.0"
description = "Signed, hash-chained, recomputable records of deterministic decisions, verifiable offline by a reader."
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
